# gitleaks configuration for bnkctl.
# CI runs gitleaks via the security-audit job in .github/workflows/ci.yml.
# This file extends the default ruleset and allowlists known false positives.
title = "bnkctl gitleaks config"

[extend]
useDefault = true

[allowlist]
description = """
Test fixtures, internal manifest templates, demo README curl examples, and synthetic
traffic-generator virtual keys (f5vk_... / demo-external-token-...) contain synthetic
placeholder tokens and keys (no real credentials).
"""
paths = [
  '''pkg/jwt/.*''',
  '''pkg/forge/.*''',
  '''pkg/k8s/manifests/.*''',
  '''internal/.*''',
  '''examples/.*''',
]
