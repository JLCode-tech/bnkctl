name: CI

# Runs on every PR and on push to main/staging.

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: vet + fmt + test + build (all 4 CLIs)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve modules
        run: |
          go mod download
          go mod verify

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: gofmt -d -l . | tee /tmp/gofmt.diff && test ! -s /tmp/gofmt.diff

      - name: go test
        run: go test -race ./...

      - name: Build unified & cloud-pinned CLIs
        run: |
          mkdir -p bin
          go build -o bin/bnkctl ./cmd/bnkctl
          go build -o bin/awsbnkctl ./cmd/awsbnkctl
          go build -o bin/azrbnkctl ./cmd/azrbnkctl
          go build -o bin/gkebnkctl ./cmd/gkebnkctl
          ./bin/bnkctl version
          ./bin/awsbnkctl version
          ./bin/azrbnkctl version
          ./bin/gkebnkctl version

  build-windows:
    name: windows build (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile Windows binaries
        run: |
          mkdir -p bin
          GOOS=windows GOARCH=amd64 go build -o bin/bnkctl-windows-amd64.exe ./cmd/bnkctl
          GOOS=windows GOARCH=arm64 go build -o bin/bnkctl-windows-arm64.exe ./cmd/bnkctl

  up-dryrun:
    name: multi-cloud validate + up/down --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate & dry-run AWS, Azure, and GCP examples
        run: |
          go build -o ./bin/bnkctl ./cmd/bnkctl
          for dir in examples/agentcore-demo examples/agentfoundry-demo examples/vertex-agent-demo; do
            echo '{"auths":{}}' > "$dir/cne_pull_64.json"
            echo 'dummy-license-jwt' > "$dir/license.jwt"
          done
          for cfg in examples/agentcore-demo/cluster.yaml examples/agentfoundry-demo/cluster.yaml examples/vertex-agent-demo/cluster.yaml; do
            echo "=== Validating $cfg ==="
            ./bin/bnkctl validate -c "$cfg"
            ./bin/bnkctl up --dry-run -c "$cfg"
            ./bin/bnkctl down --dry-run --yes -c "$cfg"
          done
          rm -f examples/*/cne_pull_64.json examples/*/license.jwt

  goreleaser-check:
    name: goreleaser config sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  security-audit:
    name: security audit (gosec + govulncheck + gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck (Go vulnerability scanner)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          set +e
          govulncheck -format json ./... > /tmp/govulncheck.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            exit "$rc"
          fi
          offenders="$(jq -r '
            select(has("finding"))
            | .finding
            | select(any(.trace[]?; .function != null))
            | select(.fixed_version != null)
            | "\(.osv)\tcalled_fix_available\t\(.fixed_version)"
          ' /tmp/govulncheck.json | sort -u)"
          if [ -n "$offenders" ]; then
            echo "govulncheck gate FAILED — called vulnerabilities with available fixes:"
            echo "$offenders"
            exit 1
          fi
          echo "govulncheck gate PASSED (zero called vulnerabilities with available fixes)"

      - name: gitleaks (secret scan — full history)
        run: |
          wget -q -O /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          echo "6298c9235dfc9278c14b28afd9b7fa4e6f4a289cb1974bd27949fc1e9122bdee  /tmp/gitleaks.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner --redact -v
