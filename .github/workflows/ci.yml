name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: vet + test + build (all 4 CLIs)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve modules
        run: |
          go mod download
          go mod verify

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: Build unified & cloud-pinned CLIs
        run: |
          mkdir -p bin
          go build -o bin/bnkctl ./cmd/bnkctl
          go build -o bin/awsbnkctl ./cmd/awsbnkctl
          go build -o bin/azrbnkctl ./cmd/azrbnkctl
          go build -o bin/gkebnkctl ./cmd/gkebnkctl
          ./bin/bnkctl version
          ./bin/awsbnkctl version
          ./bin/azrbnkctl version
          ./bin/gkebnkctl version

  security-audit:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks (secret scan — full history)
        run: |
          wget -q -O /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          echo "6298c9235dfc9278c14b28afd9b7fa4e6f4a289cb1974bd27949fc1e9122bdee  /tmp/gitleaks.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner --redact -v
