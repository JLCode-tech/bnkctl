name: Release

# Automates semantic versioning, CHANGELOG generation, and GoReleaser builds.
#
# 1. On every push to main, Release Please analyzes conventional commits
#    (feat:, fix:, chore:, etc.) and opens/updates a "Release PR".
# 2. When that Release PR is merged (or when a v* tag is pushed / triggered via
#    workflow_dispatch), GoReleaser builds cross-platform archives and
#    checksums.txt and uploads them to the GitHub Release page.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build and upload assets for, e.g. v2.4.1"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    if: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          target-branch: main
          release-type: go

  goreleaser:
    name: GoReleaser
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --parallelism 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-package:
    name: Publish GHCR Package
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Publish GHCR Container Package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL_TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag || github.ref_name }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          mkdir -p /tmp/ghcr-pkg
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X github.com/JLCode-tech/bnkctl/internal/cli.Version=${REL_TAG}" -o /tmp/ghcr-pkg/bnkctl ./cmd/bnkctl
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X github.com/JLCode-tech/bnkctl/internal/cli.Version=${REL_TAG}" -o /tmp/ghcr-pkg/awsbnkctl ./cmd/awsbnkctl
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X github.com/JLCode-tech/bnkctl/internal/cli.Version=${REL_TAG}" -o /tmp/ghcr-pkg/azrbnkctl ./cmd/azrbnkctl
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X github.com/JLCode-tech/bnkctl/internal/cli.Version=${REL_TAG}" -o /tmp/ghcr-pkg/gkebnkctl ./cmd/gkebnkctl
          cat <<'EOF' > /tmp/ghcr-pkg/Dockerfile
          FROM alpine:3.20
          RUN apk add --no-cache ca-certificates bash curl git openssh-client jq
          COPY bnkctl awsbnkctl azrbnkctl gkebnkctl /usr/local/bin/
          ENTRYPOINT ["bnkctl"]
          EOF
          IMAGE="ghcr.io/jlcode-tech/bnkctl"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/JLCode-tech/bnkctl" \
            --label "org.opencontainers.image.description=Preferred unified multi-cloud CLI for F5 BIG-IP Next for Kubernetes (BNK) & F5 BNK AI Service Plane across AWS EKS, Azure AKS, and Google Cloud GKE" \
            --label "org.opencontainers.image.licenses=MIT" \
            --label "org.opencontainers.image.version=${REL_TAG}" \
            -t "${IMAGE}:${REL_TAG}" \
            -t "${IMAGE}:latest" \
            /tmp/ghcr-pkg
          docker push "${IMAGE}:${REL_TAG}"
          docker push "${IMAGE}:latest"
