name: Release

# Automates semantic versioning, CHANGELOG generation, and GoReleaser builds.
#
# 1. On every push to main, Release Please analyzes conventional commits
#    (feat:, fix:, chore:, etc.) and opens/updates a "Release PR".
# 2. When that Release PR is merged (or when a v* tag is pushed / triggered via
#    workflow_dispatch), GoReleaser builds cross-platform archives and
#    checksums.txt and uploads them to the GitHub Release page.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build and upload assets for, e.g. v2.4.1"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          target-branch: main
          release-type: go

  goreleaser:
    name: GoReleaser
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --parallelism 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
