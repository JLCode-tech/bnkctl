apiVersion: v1
kind: Namespace
metadata:
  name: llm-egress
  labels:
    app.kubernetes.io/part-of: bnk-agentfoundry-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: llm-egress
data:
  config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      reject_old_samples: false
      allow_structured_metadata: false
    table_manager:
      retention_deletes_enabled: true
      retention_period: 168h
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: llm-egress
  labels:
    app.kubernetes.io/name: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
    spec:
      containers:
      - name: loki
        image: grafana/loki:3.0.0
        args:
        - -config.file=/etc/loki/config/config.yaml
        ports:
        - containerPort: 3100
          name: http
        readinessProbe:
          httpGet:
            path: /ready
            port: 3100
          initialDelaySeconds: 15
          periodSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /etc/loki/config
        - name: data
          mountPath: /loki
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: config
        configMap:
          name: loki-config
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: llm-egress
spec:
  selector:
    app.kubernetes.io/name: loki
  ports:
  - name: http
    port: 3100
    targetPort: 3100
    protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bnkgov-collector-config
  namespace: llm-egress
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        1
        Daemon       off
        Log_Level    info
        Parsers_File parsers.conf

    # BNK 2.4: the iRule's `log local0.` output reaches stdout of the
    # f5-toda-fluentd pod (f5-cne-core) once its stdout store is enabled by
    # phase 38d (tmm-log-stream).
    [INPUT]
        Name              tail
        Tag               bnkgov
        Path              /var/log/containers/f5-toda-fluentd-*_f5-cne-core_f5-fluentd-*.log
        Parser            cri
        Refresh_Interval  5
        Skip_Long_Lines   On
        Mem_Buf_Limit     16MB
        DB                /var/log/flb-bnkgov.db

    [FILTER]
        Name    grep
        Match   bnkgov
        Regex   message BNKGOV

    [FILTER]
        Name         parser
        Match        bnkgov
        Key_Name     message
        Parser       fluentd_stdout
        Reserve_Data Off

    [FILTER]
        Name         parser
        Match        bnkgov
        Key_Name     wrapper
        Parser       bnkgov_json
        Reserve_Data Off

    [FILTER]
        Name    grep
        Match   bnkgov
        Regex   pod_name f5-tmm

    [FILTER]
        Name         parser
        Match        bnkgov
        Key_Name     log
        Parser       bnkgov_extract
        Reserve_Data Off

    [FILTER]
        Name         parser
        Match        bnkgov
        Key_Name     payload
        Parser       bnkgov_json
        Reserve_Data Off

    [FILTER]
        Name    grep
        Match   bnkgov
        Regex   client .

    [OUTPUT]
        Name         loki
        Match        bnkgov
        Host         loki
        Port         3100
        labels       job=llm-gateway
        label_keys   $model,$status,$action,$rpc_method
        line_format  json
  parsers.conf: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<message>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z

    [PARSER]
        Name        fluentd_stdout
        Format      regex
        Regex       ^(?<ftime>\S+ \S+ \S+) (?<ftag>[^:]+): (?<wrapper>\{.*\})\s*$

    [PARSER]
        Name        bnkgov_extract
        Format      regex
        Regex       BNKGOV (?<payload>\{.*\})\s*$

    [PARSER]
        Name        bnkgov_json
        Format      json
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: bnkgov-collector
  namespace: llm-egress
  labels:
    app.kubernetes.io/name: bnkgov-collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: bnkgov-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bnkgov-collector
    spec:
      tolerations:
      - operator: Exists
      containers:
      - name: fluent-bit
        image: cr.fluentbit.io/fluent/fluent-bit:3.0
        volumeMounts:
        - name: config
          mountPath: /fluent-bit/etc/
        - name: varlog
          mountPath: /var/log
        - name: varlibcontainers
          mountPath: /var/lib/containerd
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 192Mi
      volumes:
      - name: config
        configMap:
          name: bnkgov-collector-config
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibcontainers
        hostPath:
          path: /var/lib/containerd
