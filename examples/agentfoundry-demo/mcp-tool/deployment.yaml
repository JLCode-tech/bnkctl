apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-financial-tool
  namespace: default
  labels:
    app.kubernetes.io/name: mcp-financial-tool
    app.kubernetes.io/part-of: bnk-agentfoundry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-financial-tool
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-financial-tool
        app.kubernetes.io/part-of: bnk-agentfoundry-demo
    spec:
      containers:
      - name: tool
        image: python:3.11-slim
        command: ["/bin/sh", "-c"]
        args:
        - |
          pip install --no-cache-dir fastmcp starlette uvicorn
          python /app/mcp-server.py
        env:
        - name: MCP_PORT
          value: "8080"
        - name: MCP_PUBLIC_URL
          value: "http://bnk-ingress.bnk-demo.internal/v1/mcp/forecast"
        - name: MCP_AGENT_TOKEN
          valueFrom:
            secretKeyRef:
              name: mcp-tool-tokens
              key: agent-token
        - name: MCP_EXTERNAL_TOKEN
          valueFrom:
            secretKeyRef:
              name: mcp-tool-tokens
              key: external-token
        ports:
        - name: http
          containerPort: 8080
        volumeMounts:
        - name: code
          mountPath: /app
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: code
        configMap:
          name: mcp-financial-tool-code
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-financial-tool
  namespace: default
  labels:
    app.kubernetes.io/name: mcp-financial-tool
    app.kubernetes.io/part-of: bnk-agentfoundry-demo
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8080
  selector:
    app.kubernetes.io/name: mcp-financial-tool
