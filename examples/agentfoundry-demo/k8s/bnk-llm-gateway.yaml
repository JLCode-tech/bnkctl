# ==============================================================================
# F5 BIG-IP Next for Kubernetes (BNK) 2.4.1 — LLM Gateway Manifest (Azure AKS)
# ==============================================================================
# Authentic 7-step BNK 2.4.1 LLM Gateway configuration for Azure AI Foundry:
#   Step 1: AITenant (cluster-scoped, inference.k8s.f5.com/v1alpha1)
#   Step 2: Secret + AICredential + AIProvider (f5-cne-system, vendor: AzureFoundry)
#   Step 3: AIModel with weighted primary/fallback deployments & pricing (f5-cne-system)
#   Step 4: 4-Object Route Bundle in f5-cne-system:
#           Gateway + HTTPRoute (no backendRefs) + AIGatewayProfile + AppPolicy
#   Step 5: TMM Egress & DNS in f5-cne-system:
#           Provisioned by bnkctl (Infra/infra default route + F5BigDnsCache/aigw-dns-resolver)
#   Step 6: CNE Controller restart check (performed by scripts/setup-llm-gateway.sh)
#   Step 7: DSSM Governance bootstrap & f5vk_ virtual key (scripts/setup-llm-gateway.sh)
# ==============================================================================

# ------------------------------------------------------------------------------
# Step 1: AITenant (Cluster-Scoped)
# ------------------------------------------------------------------------------
apiVersion: inference.k8s.f5.com/v1alpha1
kind: AITenant
metadata:
  name: default-tenant
  labels:
    app.kubernetes.io/part-of: bnk-agentfoundry-demo
    f5.com/bnk-release: "2.4.1"
spec:
  displayName: "Default AI Tenant"
---
# ------------------------------------------------------------------------------
# Step 2: Provider Credentials & AIProvider (Primary + Fallback in f5-cne-system)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: azure-foundry-primary-api-key
  namespace: f5-cne-system
type: Opaque
stringData:
  api-key: "replace-with-azure-foundry-primary-api-key"
---
apiVersion: inference.k8s.f5.com/v1alpha1
kind: AICredential
metadata:
  name: azure-foundry-primary-cred
  namespace: f5-cne-system
spec:
  tenantRef:
    name: default-tenant
  secretRef:
    name: azure-foundry-primary-api-key
    key: api-key
---
apiVersion: inference.k8s.f5.com/v1alpha1
kind: AIProvider
metadata:
  name: azure-foundry-australiaeast
  namespace: f5-cne-system
  labels:
    app.kubernetes.io/part-of: bnk-agentfoundry-demo
    f5.com/provider-tier: primary
spec:
  tenantRef:
    name: default-tenant
  vendor: AzureFoundry
  azureFoundry:
    endpoint: "https://australiaeast.api.cognitive.microsoft.com/models"
  credentialRef:
    name: azure-foundry-primary-cred
  enabled: true
---
apiVersion: v1
kind: Secret
metadata:
  name: azure-foundry-fallback-api-key
  namespace: f5-cne-system
type: Opaque
stringData:
  api-key: "replace-with-azure-foundry-fallback-api-key"
---
apiVersion: inference.k8s.f5.com/v1alpha1
kind: AICredential
metadata:
  name: azure-foundry-fallback-cred
  namespace: f5-cne-system
spec:
  tenantRef:
    name: default-tenant
  secretRef:
    name: azure-foundry-fallback-api-key
    key: api-key
---
apiVersion: inference.k8s.f5.com/v1alpha1
kind: AIProvider
metadata:
  name: azure-openai-eastus2-fallback
  namespace: f5-cne-system
  labels:
    app.kubernetes.io/part-of: bnk-agentfoundry-demo
    f5.com/provider-tier: fallback
spec:
  tenantRef:
    name: default-tenant
  vendor: AzureFoundry
  azureFoundry:
    endpoint: "https://eastus2.api.cognitive.microsoft.com/openai/v1"
  credentialRef:
    name: azure-foundry-fallback-cred
  enabled: true
---
# ------------------------------------------------------------------------------
# Step 3: AIModel Definitions (Weighted Primary + Fallback Deployments in f5-cne-system)
# ------------------------------------------------------------------------------
apiVersion: inference.k8s.f5.com/v1alpha1
kind: AIModel
metadata:
  name: gpt-4o
  namespace: f5-cne-system
  labels:
    app.kubernetes.io/part-of: bnk-agentfoundry-demo
spec:
  tenantRef:
    name: default-tenant
  name: gpt-4o
  deployments:
    - name: primary
      providerRef:
        name: azure-foundry-australiaeast
      upstream: gpt-4o
      dialects: ["openai"]
      weight: 85
      state: Active
      pricing:
        inputPerMtok: 2500000
        outputPerMtok: 10000000
    - name: fallback
      providerRef:
        name: azure-openai-eastus2-fallback
      upstream: gpt-4o-mini
      dialects: ["openai"]
      weight: 15
      state: Active
      pricing:
        inputPerMtok: 150000
        outputPerMtok: 600000
---
apiVersion: inference.k8s.f5.com/v1alpha1
kind: AIModel
metadata:
  name: gpt-4o-mini
  namespace: f5-cne-system
  labels:
    app.kubernetes.io/part-of: bnk-agentfoundry-demo
spec:
  tenantRef:
    name: default-tenant
  name: gpt-4o-mini
  deployments:
    - name: primary
      providerRef:
        name: azure-foundry-australiaeast
      upstream: gpt-4o-mini
      dialects: ["openai"]
      weight: 85
      state: Active
      pricing:
        inputPerMtok: 150000
        outputPerMtok: 600000
    - name: fallback
      providerRef:
        name: azure-openai-eastus2-fallback
      upstream: gpt-4o-mini
      dialects: ["openai"]
      weight: 15
      state: Active
      pricing:
        inputPerMtok: 150000
        outputPerMtok: 600000
---
# ------------------------------------------------------------------------------
# Step 4: 4-Object Route Bundle (Gateway + HTTPRoute + AIGatewayProfile + AppPolicy)
# ------------------------------------------------------------------------------
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: f5-gateway-class
spec:
  controllerName: f5.com/f5-cne-system-f5-cne-controller
  description: F5 BIG-IP Next for Kubernetes 2.4.1 LLM GatewayClass
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: llm-chat-route-gw
  namespace: f5-cne-system
  labels:
    app.kubernetes.io/part-of: bnk-agentfoundry-demo
spec:
  gatewayClassName: f5-gateway-class
  infrastructure:
    parametersRef:
      group: gateway.k8s.f5.com
      kind: GatewaySettings
      name: bnk-gateway-settings
  addresses:
    - type: IPAddress
      value: "10.0.17.101"
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-chat-route-route
  namespace: f5-cne-system
  labels:
    app.kubernetes.io/part-of: bnk-agentfoundry-demo
spec:
  parentRefs:
    - name: llm-chat-route-gw
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      timeouts:
        request: 300s
        backendRequest: 300s
---
apiVersion: inference.k8s.f5.com/v1alpha1
kind: AIGatewayProfile
metadata:
  name: llm-chat-route
  namespace: f5-cne-system
  labels:
    app.kubernetes.io/part-of: bnk-agentfoundry-demo
  annotations:
    inference.k8s.f5.com/semantic_cache_pool_max_size: "64"
    inference.k8s.f5.com/semantic_cache_pool_idle_timeout: "300s"
    semantic_cache_pool_max_size: "64"
    semantic_cache_pool_idle_timeout: "300s"
spec:
  tenantRef:
    name: default-tenant
  auth:
    virtualKeys: {}
  failover:
    on429: true
    on5xx: true
    maxAttempts: 2
    cooldown: 30s
    honorRetryAfter: true
  promptCache: {}
---
apiVersion: gateway.k8s.f5.com/v1alpha1
kind: AppPolicy
metadata:
  name: llm-chat-route-apppolicy
  namespace: f5-cne-system
  labels:
    app.kubernetes.io/part-of: bnk-agentfoundry-demo
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: llm-chat-route-gw
      sectionName: http
  extensionRefs:
    - group: inference.k8s.f5.com
      kind: AIGatewayProfile
      name: llm-chat-route
---
apiVersion: k8s.f5net.com/v1
kind: F5BigCneIrule
metadata:
  name: aigw-h1-compat-irule
  namespace: f5-cne-system
  labels:
    app.kubernetes.io/part-of: bnk-agentfoundry-demo
spec:
  iRule: |
    when CLIENT_DATA priority 1 {
        TCP::release
        event CLIENT_DATA disable
    }
---
apiVersion: gateway.k8s.f5.com/v1alpha1
kind: NetPolicy
metadata:
  name: llm-chat-route-netpolicy
  namespace: f5-cne-system
  labels:
    app.kubernetes.io/part-of: bnk-agentfoundry-demo
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: llm-chat-route-gw
      sectionName: http
  extensionRefs:
    - group: k8s.f5net.com
      kind: F5BigCneIrule
      name: aigw-h1-compat-irule
---
# ------------------------------------------------------------------------------
# Step 5: TMM DNS Resolver in f5-cne-system (F5BigDnsCache/aigw-dns-resolver)
# Forwards root zone ("") queries to cluster DNS and 8.8.8.8 / 1.1.1.1
# ------------------------------------------------------------------------------
apiVersion: k8s.f5net.com/v1
kind: F5BigDnsCache
metadata:
  name: aigw-dns-resolver
  namespace: f5-cne-system
  labels:
    app.kubernetes.io/part-of: bnk-agentfoundry-demo
spec:
  cacheType: net-resolver
  netResolver:
    useIpv4: true
    useIpv6: false
    forwardZones:
      - forwardZone: "."
        nameServers:
          - ipAddress: 10.240.0.10
            port: 53
          - ipAddress: 8.8.8.8
            port: 53
          - ipAddress: 1.1.1.1
            port: 53
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: azure-foundry-upstream-code
  namespace: default
  labels:
    app.kubernetes.io/part-of: bnk-agentfoundry-demo
data:
  server.py: |
    #!/usr/bin/env python3
    import json
    import time
    import uuid
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    MODELS_RESPONSE = {
        "object": "list",
        "data": [
            {"id": "gpt-4o", "object": "model", "created": 1715367049, "owned_by": "azure-ai-foundry"},
            {"id": "gpt-4o-mini", "object": "model", "created": 1721172741, "owned_by": "azure-ai-foundry"},
            {"id": "gpt-4o-2024-11-20", "object": "model", "created": 1732060800, "owned_by": "azure-ai-foundry"},
            {"id": "gpt-4o-mini-2024-07-18", "object": "model", "created": 1721260800, "owned_by": "azure-ai-foundry"},
        ],
    }

    class FoundryHandler(BaseHTTPRequestHandler):
        def log_message(self, fmt, *args):
            pass

        def do_GET(self):
            if self.path.startswith("/healthz"):
                self.send_response(200)
                self.send_header("Content-Type", "text/plain")
                self.end_headers()
                self.wfile.write(b"ok")
                return
            body = json.dumps(MODELS_RESPONSE).encode("utf-8")
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_POST(self):
            length = int(self.headers.get("Content-Length", "0") or "0")
            raw = self.rfile.read(length) if length > 0 else b"{}"
            try:
                req = json.loads(raw.decode("utf-8", errors="replace"))
            except Exception:
                req = {}
            model = req.get("model") or "gpt-4o"
            served = "gpt-4o-2024-11-20" if "mini" not in model else "gpt-4o-mini-2024-07-18"
            messages = req.get("messages") or []
            user_text = ""
            for m in reversed(messages):
                if isinstance(m, dict) and m.get("role") == "user":
                    user_text = str(m.get("content") or "")
                    break
            reply_text = (
                f"[Azure AI Foundry australiaeast ({served})] Governed synthesis via F5 BNK 2.4.1 AI Gateway: "
                f"{user_text[:180] if user_text else 'Forecast and risk analysis verified.'}"
            )
            prompt_tk = max(24, len(raw) // 4)
            comp_tk = max(32, len(reply_text) // 4)
            req_id = "chatcmpl-" + uuid.uuid4().hex[:20]
            created = int(time.time())
            if req.get("stream"):
                chunk = {
                    "id": req_id,
                    "object": "chat.completion.chunk",
                    "created": created,
                    "model": served,
                    "choices": [{"index": 0, "delta": {"role": "assistant", "content": reply_text}, "finish_reason": "stop"}],
                    "usage": {"prompt_tokens": prompt_tk, "completion_tokens": comp_tk, "total_tokens": prompt_tk + comp_tk},
                }
                sse = f"data: {json.dumps(chunk)}\n\ndata: [DONE]\n\n".encode("utf-8")
                self.send_response(200)
                self.send_header("Content-Type", "text/event-stream")
                self.send_header("Cache-Control", "no-cache")
                self.send_header("Content-Length", str(len(sse)))
                self.end_headers()
                self.wfile.write(sse)
                return
            resp = {
                "id": req_id,
                "object": "chat.completion",
                "created": created,
                "model": served,
                "choices": [
                    {
                        "index": 0,
                        "message": {"role": "assistant", "content": reply_text},
                        "finish_reason": "stop",
                    }
                ],
                "usage": {
                    "prompt_tokens": prompt_tk,
                    "completion_tokens": comp_tk,
                    "total_tokens": prompt_tk + comp_tk,
                },
            }
            body = json.dumps(resp).encode("utf-8")
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

    if __name__ == "__main__":
        srv = ThreadingHTTPServer(("0.0.0.0", 8080), FoundryHandler)
        print("Azure AI Foundry upstream responder listening on :8080", flush=True)
        srv.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-foundry-upstream
  namespace: default
  labels:
    app: azure-foundry-upstream
    app.kubernetes.io/part-of: bnk-agentfoundry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: azure-foundry-upstream
  template:
    metadata:
      labels:
        app: azure-foundry-upstream
    spec:
      nodeSelector:
        app: f5-tmm
      tolerations:
        - operator: Exists
      containers:
        - name: upstream
          image: python:3.11-slim
          command: ["python3", "-u", "/app/server.py"]
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: code
              mountPath: /app
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: code
          configMap:
            name: azure-foundry-upstream-code
---
apiVersion: v1
kind: Service
metadata:
  name: azure-foundry-upstream
  namespace: default
  labels:
    app: azure-foundry-upstream
    app.kubernetes.io/part-of: bnk-agentfoundry-demo
spec:
  selector:
    app: azure-foundry-upstream
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
