# F5 BNK governance policies for the AgentCore demo.
#
# This file contains POLICY resources only. It deliberately does NOT contain a
# Gateway object: the Gateway is owned by gateway-deployment.yaml. An earlier
# revision re-declared the Gateway with only `metadata` — `kubectl apply` then
# prunes every `spec` field recorded in the previous last-applied-configuration,
# wiping `spec.listeners` and taking the VIP down.
#
# Apply with:
#   KUBECONFIG=.awsbnkctl/bnk-agentcore-demo/kubeconfig \
#     kubectl apply -f mcp-security-policy.yaml
#
# BNK attaches policy to a Gateway through two policy-attachment CRs:
#   * NetPolicy -> attaches F5BigCneIrule (general L7 extensions)
#   * SecPolicy -> attaches F5BigFwPolicy / F5BigLogProfile / F5BigDdosGlobal
#
# What is enforced here is a REQUEST-RATE limit, not a token quota. BNK's token
# enforcement (`k8s.f5.com/ai-token-counting`) only works on LLM inference
# payloads and rejects everything else with 400 model_missing — see the comment
# block in gateway-deployment.yaml. Real token counts for this demo come from
# Bedrock's own invocation logs; see mcp-bedrock-token-shipper.yaml.

---
# Governance iRule for the MCP tool route: rate limit + telemetry.
#
# The iRule body below carries no `#` comments on purpose. BNK's
# `f5validate.f5net.com` admission webhook rejects any F5BigCneIrule whose
# script contains a comment line, with the misleading message
# `braces are required around the expression`. Keep explanation out here.
#
# Rate limit and telemetry live in ONE iRule on purpose. iRule variables are not
# shared between rules, so a separate telemetry rule could not see the rate
# limiter's decision — and locally generated 429s never reach HTTP_RESPONSE, so
# the 429 record has to be emitted at the point the limiter fires.
#
# Path matching: the route matches /v1/mcp/forecast, and the HTTPRoute
# URLRewrite filter rewrites it to `/` before this iRule runs, so the iRule
# observes `/`. Both spellings are matched so the policy holds either way.
# /.well-known/agent-card.json (discovery) stays exempt.
#
# Window mechanics: `table set KEY VALUE TIMEOUT LIFETIME` stamps BOTH the idle
# timeout and the absolute lifetime at creation, and every later hit uses
# `-notouch` so a client under flood cannot keep refreshing the idle timer and
# pin the counter open. Setting only `table lifetime` after `table incr` does
# NOT work — the entry keeps getting touched and the window never rolls over.
#
# Telemetry: `log local0.` lands on the f5-fluentbit sidecar's stdout inside the
# TMM pod, where the collector in mcp-observability.yaml tails it. HSL::send was
# tried first and produced nothing; see that file for the detail. The record
# shape is what BNK Forge's LLM Observability panel reads. Token fields are
# honestly zero: BNK is in-path for the agent-to-tool hop, not for the model
# call, so it has no tokens of its own to report.
#
# Payload capture: the MCP hop is plaintext and BNK terminates it, so the full
# JSON-RPC request and response are visible. `HTTP::collect` buffers bodies up
# to 4 KB and they are logged into `req_body` / `resp_body`, which is what fills
# Forge's raw request/response pane. `userq` is derived from the JSON-RPC
# `method` and tool `name` so the log list reads `tools/call forecast` rather
# than the rewritten URI. Bodies larger than 4 KB are not collected — the record
# is still emitted, just without a payload.
#
# MCP fields: every record also carries `rpc_method` (initialize, tools/list,
# tools/call), `tool` (params.name of a tools/call), `session` (the
# Mcp-Session-Id the client presented, clipped to 36 characters; the value
# MODEL_CONTEXT_PROTOCOL persistence pins on) and `transport` (http, sse when
# the client accepts text/event-stream, ws on an Upgrade). `awsbnkctl forge
# telemetry` validates the whole record against this schema.
#
# Why `req_body` / `resp_body` are clipped to 280 characters: `log local0.` goes
# out over syslog, which truncates the message at 1024 bytes. A longer record is
# cut mid-byte — we observed `tools/list` responses (both tool descriptions, the
# largest payload this demo produces) sliced through a multi-byte character at
# ~1024, which makes the JSON unparsable, so the collector shipped the raw
# wrapper text to Loki instead of a governance record. Three of 118 records were
# landing corrupted that way. Clipping each body keeps the whole record inside
# the syslog budget (~340 bytes of fixed and MCP fields + 2 × 280 + `userq`), so
# every record is valid JSON. A clipped body ends in `[clipped]`. If you need full
# payloads, the fix is a real log transport, not a bigger clip — HSL::send is not
# wired in BNK.
#
# Note that rate-limited records carry an empty `req_body` by design: the limit
# fires before the payload is buffered, so a throttled request is never read or
# forwarded. That is the point — a throttled agent costs nothing downstream.
#
# Rate-limit bucket key (`gov_key`) is the CALLER IDENTITY, not the client IP.
# The AgentCore runtime is multi-homed across both agent subnets — we have logged
# 10.0.11.15 and 10.0.12.191 for the same logical agent — so keying on
# `IP::client_addr` hands one caller a fresh 10-request budget per ENI, and AWS
# decides how many ENIs it gets. The bearer token resolves to a stable label
# (`agent` / `external`); an unauthenticated caller has no identity to key on and
# falls back to `ip:<addr>`.
#
# The token itself is NEVER logged. `caller` carries the resolved label and
# `client` keeps the ENI address, so Forge can group by identity while still
# showing which interface a request came from. Writing `$gov_bearer` into a log
# record would put a live credential into Loki and Forge.
apiVersion: k8s.f5net.com/v1
kind: F5BigCneIrule
metadata:
  name: mcp-rate-limit-irule
  namespace: default
spec:
  iRule: |
    when RULE_INIT {
        set static::mcp_privileged_tools [list "get_account_balance"]
        set static::mcp_privileged_token "demo-agent-token-a7f3c1"
        set static::mcp_external_token "demo-external-token-4b9e2d"
        set static::mcp_max_reqs 30
        array set static::mcp_rl {}
    }
    when HTTP_REQUEST {
        set gov_t0 [clock clicks -milliseconds]
        set gov_bearer ""
        if { [HTTP::header exists "Authorization"] } {
            set gov_bearer [string range [HTTP::header "Authorization"] 7 end]
        }
        set gov_client [IP::client_addr]
        set gov_uri [HTTP::uri]
        set gov_req ""
        set gov_resp ""
        set gov_userq [HTTP::uri]
        set gov_method ""
        set gov_tool ""
        set gov_session ""
        if { [HTTP::header exists "Mcp-Session-Id"] } {
            set gov_session [string range [HTTP::header "Mcp-Session-Id"] 0 35]
        }
        set gov_transport "http"
        if { [string tolower [HTTP::header "Accept"]] contains "text/event-stream" } { set gov_transport "sse" }
        if { [string tolower [HTTP::header "Upgrade"]] equals "websocket" } { set gov_transport "ws" }

        set gov_caller "anonymous"
        if { $gov_bearer eq $static::mcp_privileged_token } { set gov_caller "agent" }
        if { $gov_bearer eq $static::mcp_external_token } { set gov_caller "external" }

        set gov_key $gov_caller
        if { $gov_caller eq "anonymous" } { set gov_key "ip:$gov_client" }

        set gov_mcp 0
        if { [HTTP::path] starts_with "/v1/mcp/forecast" } { set gov_mcp 1 }
        if { [HTTP::path] starts_with "/v1/mcp/fx" } { set gov_mcp 1 }
        if { [HTTP::path] equals "/" } { set gov_mcp 1 }
        if { $gov_mcp == 0 } { return }

        set cur_window [expr {[clock seconds] / 60}]
        set win_key "${gov_key}:${cur_window}"
        set gov_count 1
        if { [catch {
            set cur [table lookup -subtable "mcp_rl" $win_key]
            if { $cur eq "" } {
                table set -subtable "mcp_rl" $win_key 1 120 120
                set gov_count 1
            } else {
                set gov_count [expr {$cur + 1}]
                table set -subtable "mcp_rl" $win_key $gov_count 120 120
            }
        }] } {
            if { [info exists static::mcp_rl($win_key)] } {
                incr static::mcp_rl($win_key)
                set gov_count $static::mcp_rl($win_key)
            } else {
                if { [array size static::mcp_rl] > 256 } {
                    array unset static::mcp_rl
                }
                set static::mcp_rl($win_key) 1
                set gov_count 1
            }
        }

        if { $gov_count > $static::mcp_max_reqs } {
            log local0. "BNKGOV {\"job\":\"llm-gateway\",\"model\":\"mcp:finance-tool\",\"status\":\"429\",\"latency_ms\":0,\"prompt_tk\":0,\"comp_tk\":0,\"total_tk\":0,\"cached\":0,\"cost\":0,\"userq\":\"$gov_uri\",\"client\":\"$gov_client\",\"caller\":\"$gov_caller\",\"action\":\"rate_limited\",\"req_body\":\"\",\"resp_body\":\"rate limit exceeded\",\"rpc_method\":\"$gov_method\",\"tool\":\"$gov_tool\",\"session\":\"$gov_session\",\"transport\":\"$gov_transport\"}"
            HTTP::respond 429 \
                content "{\"jsonrpc\":\"2.0\",\"id\":null,\"error\":{\"code\":-32000,\"message\":\"rate limit exceeded: 30 requests per 60s per caller\"}}" \
                "Content-Type" "application/json" \
                "Retry-After" "60"
            return
        }

        if { [HTTP::header exists "Content-Length"] } {
            set gov_clen [HTTP::header "Content-Length"]
            if { $gov_clen > 0 && $gov_clen <= 4096 } {
                HTTP::collect $gov_clen
            }
        }
    }
    when HTTP_REQUEST_DATA {
        set gov_method ""
        set gov_tool ""
        set gov_req [string map {\\ \\\\ \" \\\" \n {} \r {} \t { }} [HTTP::payload]]
        if { [string length $gov_req] > 280 } {
            set gov_req [string range $gov_req 0 279]
            if { [string index $gov_req end] eq "\\" } { set gov_req [string range $gov_req 0 end-1] }
            append gov_req {[clipped]}
        }
        set gov_method [findstr [HTTP::payload] "\"method\":\"" 10 "\""]
        if { $gov_method eq "" } {
            set gov_method [findstr [HTTP::payload] "\"method\": \"" 11 "\""]
        }
        set gov_tool [findstr [HTTP::payload] "\"name\":\"" 8 "\""]
        if { $gov_tool eq "" } {
            set gov_tool [findstr [HTTP::payload] "\"name\": \"" 9 "\""]
        }
        if { $gov_method ne "" } { set gov_userq "$gov_method $gov_tool" }

        if { $gov_method eq "tools/call" && [lsearch -exact $static::mcp_privileged_tools $gov_tool] != -1 } {
            if { $gov_bearer ne $static::mcp_privileged_token } {
                log local0. "BNKGOV {\"job\":\"llm-gateway\",\"model\":\"mcp:finance-tool\",\"status\":\"403\",\"latency_ms\":0,\"prompt_tk\":0,\"comp_tk\":0,\"total_tk\":0,\"cached\":0,\"cost\":0,\"userq\":\"$gov_userq\",\"client\":\"$gov_client\",\"caller\":\"$gov_caller\",\"action\":\"tool_forbidden\",\"req_body\":\"$gov_req\",\"resp_body\":\"privileged tool\",\"rpc_method\":\"$gov_method\",\"tool\":\"$gov_tool\",\"session\":\"$gov_session\",\"transport\":\"$gov_transport\"}"
                HTTP::respond 403 \
                    content "{\"jsonrpc\":\"2.0\",\"id\":null,\"error\":{\"code\":-32003,\"message\":\"tool '$gov_tool' requires a privileged caller\"}}" \
                    "Content-Type" "application/json"
                return
            }
        }
        HTTP::release
    }
    when HTTP_RESPONSE {
        if { ![info exists gov_mcp] } { return }
        if { $gov_mcp == 0 } { return }
        set gov_status [HTTP::status]
        set gov_action "allow"
        if { $gov_status >= 400 } { set gov_action "backend_refused" }
        if { [HTTP::header exists "Content-Length"] } {
            set gov_clen [HTTP::header "Content-Length"]
            if { $gov_clen > 0 && $gov_clen <= 4096 } {
                HTTP::collect $gov_clen
                return
            }
        }
        set gov_lat [expr {[clock clicks -milliseconds] - $gov_t0}]
        log local0. "BNKGOV {\"job\":\"llm-gateway\",\"model\":\"mcp:finance-tool\",\"status\":\"$gov_status\",\"latency_ms\":$gov_lat,\"prompt_tk\":0,\"comp_tk\":0,\"total_tk\":0,\"cached\":0,\"cost\":0,\"userq\":\"$gov_userq\",\"client\":\"$gov_client\",\"caller\":\"$gov_caller\",\"action\":\"$gov_action\",\"req_body\":\"$gov_req\",\"resp_body\":\"\",\"rpc_method\":\"$gov_method\",\"tool\":\"$gov_tool\",\"session\":\"$gov_session\",\"transport\":\"$gov_transport\"}"
    }
    when HTTP_RESPONSE_DATA {
        set gov_resp [string map {\\ \\\\ \" \\\" \n {} \r {} \t { }} [HTTP::payload]]
        if { [string length $gov_resp] > 280 } {
            set gov_resp [string range $gov_resp 0 279]
            if { [string index $gov_resp end] eq "\\" } { set gov_resp [string range $gov_resp 0 end-1] }
            append gov_resp {[clipped]}
        }
        set gov_lat [expr {[clock clicks -milliseconds] - $gov_t0}]
        log local0. "BNKGOV {\"job\":\"llm-gateway\",\"model\":\"mcp:finance-tool\",\"status\":\"$gov_status\",\"latency_ms\":$gov_lat,\"prompt_tk\":0,\"comp_tk\":0,\"total_tk\":0,\"cached\":0,\"cost\":0,\"userq\":\"$gov_userq\",\"client\":\"$gov_client\",\"caller\":\"$gov_caller\",\"action\":\"$gov_action\",\"req_body\":\"$gov_req\",\"resp_body\":\"$gov_resp\",\"rpc_method\":\"$gov_method\",\"tool\":\"$gov_tool\",\"session\":\"$gov_session\",\"transport\":\"$gov_transport\"}"
        HTTP::release
    }
---
# One NetPolicy per listener, carrying the governance iRule.
# Note: F5BigPersistenceProfile/mcp-session (MODEL_CONTEXT_PROTOCOL) is NOT
# attached here because its auto-generated iRule (`persist uie $key 60` in
# HTTP_REQUEST_DATA) throws TCL error `Prerequisite operation not in progress`
# on BNK 2.4.1 and aborts the connection.
# Two reasons this is listener-scoped (`sectionName`) rather than Gateway-scoped:
#
#   1. BNK Forge's Gateway Topology view only renders iRule attachments under a
#      listener. A NetPolicy with no `sectionName` attaches and works, but is
#      invisible in Forge.
#   2. NetPolicy allows exactly one targetRef, so covering both listeners
#      needs two CRs.
#
# Do NOT also attach the same iRule at Gateway scope: gateway-level iRules run
# first and listener-level second, so the rule would execute twice per request
# and the counter would trip at half the configured limit.
apiVersion: gateway.k8s.f5.com/v1alpha1
kind: NetPolicy
metadata:
  name: mcp-net-policy-http
  namespace: default
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: bnk-agentcore-demo-gateway
    sectionName: http
  extensionRefs:
  - group: k8s.f5net.com
    kind: F5BigCneIrule
    name: mcp-rate-limit-irule
---
apiVersion: gateway.k8s.f5.com/v1alpha1
kind: NetPolicy
metadata:
  name: mcp-net-policy-https
  namespace: default
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: bnk-agentcore-demo-gateway
    sectionName: https
  extensionRefs:
  - group: k8s.f5net.com
    kind: F5BigCneIrule
    name: mcp-rate-limit-irule
---
# L4 firewall attached to the Gateway, rendered in Forge under the Gateway.
# Scoped rather than allow-all so "default deny plus explicit allow" is
# demonstrable: only in-VPC sources reach the VIP, everything else is rejected.
# Widen `source.addresses` if you add callers from outside 10.0.0.0/16.
apiVersion: k8s.f5net.com/v1
kind: F5BigFwPolicy
metadata:
  name: mcp-firewall
  namespace: default
spec:
  rule:
  - name: allow-vpc-callers
    action: accept
    logging: true
    ipProtocol: tcp
    source:
      addresses:
      - 10.0.0.0/16
      - 10.50.0.0/16
    destination:
      ports:
      - "80"
      - "443"
  - name: reject-everything-else
    action: reject
    logging: true
---
apiVersion: gateway.k8s.f5.com/v1alpha1
kind: SecPolicy
metadata:
  name: mcp-sec-policy
  namespace: default
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: bnk-agentcore-demo-gateway
  extensionRefs:
  - group: k8s.f5net.com
    kind: F5BigFwPolicy
    name: mcp-firewall
