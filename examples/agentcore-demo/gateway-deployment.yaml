# The BNK Gateway for the AgentCore demo: TLS certificate, GatewaySettings,
# Gateway (80 and 443) and both HTTPRoutes.
#
# Apply with the cluster config so {{.GATEWAYCLASS_NAME}} and {{.BNK_CA_ISSUER}}
# (the in-cluster CA ClusterIssuer phase 12 created) are filled from state:
#   awsbnkctl k apply --config examples/agentcore-demo/cluster.yaml \
#     -f examples/agentcore-demo/gateway-deployment.yaml
#
# BNK 2.4: a Gateway gets its listener context from a GatewaySettings via
# infrastructure.parametersRef. Without it the controller programs nothing.
# The static VIP must sit inside the Infra listener pool (.100-.199); .150 is
# the slot reserved for this demo in docs/SCENARIOS.md.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: bnk-agentcore-demo-gatewayclass
spec:
  controllerName: f5.com/f5-cne-system-f5-cne-controller
  description: F5 BIG-IP Kubernetes Gateway
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: mcp-selfsigned-issuer
  namespace: default
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mcp-tls
  namespace: default
spec:
  secretName: mcp-tls
  duration: 2160h
  renewBefore: 360h
  commonName: bnk-ingress.bnk-demo.internal
  dnsNames:
  - bnk-ingress.bnk-demo.internal
  issuerRef:
    name: mcp-selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
---
apiVersion: gateway.k8s.f5.com/v1alpha1
kind: GatewaySettings
metadata:
  name: bnk-agentcore-demo
  namespace: default
spec:
  egressConfigs:
  - hardwareAcceleration: none
    name: default-egress
    networkRef:
      name: int-vlan-infra
    sourceNATConfig:
      type: Automap
  ingressConfig:
    defaultListenerNetwork:
      ipamRefs:
      - name: listener-pool
      networkRefs:
      - name: ext-vlan-infra
      sourceNATConfig:
        type: Automap
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: bnk-agentcore-demo-gateway
  namespace: default
spec:
  gatewayClassName: bnk-agentcore-demo-gatewayclass
  infrastructure:
    parametersRef:
      group: gateway.k8s.f5.com
      kind: GatewaySettings
      name: bnk-agentcore-demo
  # AI token counting is deliberately off. It is Gateway-scoped
  # (infrastructure.annotations "k8s.f5.com/ai-token-counting") and rejects
  # every request body without an LLM `model` field with 400 model_missing,
  # which breaks MCP JSON-RPC. Meter an LLM backend through its own Gateway.
  listeners:
  - name: http
    protocol: HTTP
    port: 80
  - name: https
    protocol: HTTPS
    port: 443
    tls:
      certificateRefs:
      - kind: Secret
        group: ""
        name: mcp-tls
        namespace: default
    allowedRoutes:
      namespaces:
        from: All
      kinds:
      - kind: HTTPRoute
  addresses:
  - type: IPAddress
    value: 10.0.10.150
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-financial-route
  namespace: default
spec:
  parentRefs:
  - name: bnk-agentcore-demo-gateway
  hostnames:
  - "bnk-ingress.bnk-demo.internal"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v1/mcp/forecast
    - path:
        type: PathPrefix
        value: /v1/mcp/fx
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: mcp-financial-tool
      port: 80
      weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-discovery-route
  namespace: default
spec:
  parentRefs:
  - name: bnk-agentcore-demo-gateway
  hostnames:
  - "bnk-ingress.bnk-demo.internal"
  rules:
  - matches:
    - path:
        type: Exact
        value: /.well-known/agent-card.json
    backendRefs:
    - name: mcp-financial-tool
      port: 80
      weight: 1
