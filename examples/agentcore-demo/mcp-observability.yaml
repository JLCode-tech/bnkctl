# Live observability sink for BNK governance telemetry.
#
#   BNK TMM  --(iRule: log local0.)-->  f5-fluentbit sidecar (forward only)
#                                            |
#                              f5-toda-fluentd (f5-cne-core) stdout
#                                            |
#                          Fluent Bit DaemonSet tails the container log
#                                            |
#                                          Loki  <-- BNK Forge reads
#                                  http://loki.llm-egress:3100
#
# BNK 2.4: the TMM pod's f5-fluentbit sidecar has no stdout output; it forwards
# every TMM line to f5-toda-fluentd, which prints it when the stdout store in
# the f5-toda-fluentd-custom ConfigMap is on (`awsbnkctl up` phase 24d and
# `awsbnkctl bnk upgrade` enable it). Each stdout line wraps the TMM syslog
# line in JSON: `<ts> kube.f5.log: {"pod_name":"f5-tmm",...,"log":"<134>... Rule
# ...: BNKGOV {...}"}`, so the collector parses the wrapper first and the
# governance record out of its `log` field second.
#
# Namespace, service name and port are NOT arbitrary: Forge's LLM Observability
# panel queries `http://loki.llm-egress:3100` and expects Loki streams labelled
# `job="llm-gateway"` with `model` and `status`. Deviate and the panel is empty.
# `action` and `rpc_method` are added as labels too (four values each) so the
# 429 throttling and tools/call rates can be selected without parsing lines;
# `awsbnkctl forge telemetry` reads the same stream and checks every record.
#
# Shape borrowed from the bnk-forge-modules catalog: `app/demo-observability`
# (Loki 3.0) and `modules/live-observability-collector` (Fluent Bit DaemonSet
# tailing pod logs). Deliberately NOT used from that catalog:
#   * app/demo-ai-proxy (LiteLLM in front of Bedrock) — this demo calls Bedrock
#     directly through AgentCore; a proxy shim would be a fiction.
#   * app/demo-ai-analyzer (F5BigAnalyzer CR) — not needed here.
#   * app/demo-irules "token counting" iRule — despite the name it only stamps
#     X-BNK-* headers and logs to local0; it counts nothing.
#
# Why a log tail and not HSL: BNK accepts an F5BigLogHslpub CR, but
# `HSL::open`/`HSL::send` from an F5BigCneIrule produced no datagrams at the
# receiver (tested against a Fluent Bit UDP listener, with the
# publisher named /Common/<cr>, <cr> and /default/<cr>). `log local0.` from the
# same iRule works and is what this pipeline consumes.
#
# Apply with:
#   KUBECONFIG=.awsbnkctl/bnk-agentcore-demo/kubeconfig \
#     kubectl apply -f mcp-observability.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: llm-egress
  labels:
    app.kubernetes.io/part-of: bnk-agentcore-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: llm-egress
data:
  config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      reject_old_samples: false
      allow_structured_metadata: false
    table_manager:
      retention_deletes_enabled: true
      retention_period: 168h
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: llm-egress
  labels:
    app.kubernetes.io/name: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
    spec:
      containers:
      - name: loki
        image: grafana/loki:3.0.0
        args:
        - -config.file=/etc/loki/config/config.yaml
        ports:
        - containerPort: 3100
          name: http
        readinessProbe:
          httpGet:
            path: /ready
            port: 3100
          initialDelaySeconds: 20
          periodSeconds: 10
        volumeMounts:
        - name: config
          mountPath: /etc/loki/config
        - name: data
          mountPath: /loki
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: config
        configMap:
          name: loki-config
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: llm-egress
spec:
  selector:
    app.kubernetes.io/name: loki
  ports:
  - name: http
    port: 3100
    targetPort: 3100
    protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bnkgov-collector-config
  namespace: llm-egress
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        1
        Daemon       off
        Log_Level    info
        Parsers_File parsers.conf

    # The iRule's `log local0.` output reaches stdout of the f5-toda-fluentd
    # pod (f5-cne-core) once its stdout store is on, so that is the container
    # log we tail. Each line wraps the TMM syslog line in a JSON object.
    [INPUT]
        Name              tail
        Tag               bnkgov
        Path              /var/log/containers/f5-toda-fluentd-*_f5-cne-core_f5-fluentd-*.log
        Parser            cri
        Refresh_Interval  5
        Skip_Long_Lines   On
        Mem_Buf_Limit     16MB
        DB                /var/log/flb-bnkgov.db

    [FILTER]
        Name    grep
        Match   bnkgov
        Regex   message BNKGOV

    # Unwrap the fluentd stdout line: `<ts> <tag>: {json}`, then the JSON, then
    # keep only TMM pod lines and pull the governance record out of `log`.
    [FILTER]
        Name         parser
        Match        bnkgov
        Key_Name     message
        Parser       fluentd_stdout
        Reserve_Data Off

    [FILTER]
        Name         parser
        Match        bnkgov
        Key_Name     wrapper
        Parser       bnkgov_json
        Reserve_Data Off

    [FILTER]
        Name    grep
        Match   bnkgov
        Regex   pod_name f5-tmm

    [FILTER]
        Name         parser
        Match        bnkgov
        Key_Name     log
        Parser       bnkgov_extract
        Reserve_Data Off

    [FILTER]
        Name         parser
        Match        bnkgov
        Key_Name     payload
        Parser       bnkgov_json
        Reserve_Data Off

    # Fail closed on unparsable records. When bnkgov_json cannot parse its input
    # the record passes through UNCHANGED rather than being dropped, so the raw
    # container-log wrapper lands in Loki and renders as junk in Forge. Requiring
    # a `client` field means only records that actually parsed are shipped.
    # The upstream cause of malformed input was syslog truncating oversized
    # records; that is fixed by clipping the bodies in the iRule
    # (see mcp-security-policy.yaml). This filter is the backstop.
    [FILTER]
        Name    grep
        Match   bnkgov
        Regex   client .

    [OUTPUT]
        Name         loki
        Match        bnkgov
        Host         loki
        Port         3100
        labels       job=llm-gateway
        label_keys   $model,$status,$action,$rpc_method
        line_format  json
  parsers.conf: |
    # containerd/CRI log line: <ts> <stream> <flags> <message>
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<message>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z

    # ... Rule default-mcp-rate-limit-irule <HTTP_RESPONSE>: BNKGOV {"job":...}
    [PARSER]
        Name        fluentd_stdout
        Format      regex
        Regex       ^(?<ftime>\S+ \S+ \S+) (?<ftag>[^:]+): (?<wrapper>\{.*\})\s*$
    [PARSER]
        Name        bnkgov_extract
        Format      regex
        Regex       BNKGOV (?<payload>\{.*\})\s*$

    [PARSER]
        Name        bnkgov_json
        Format      json
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: bnkgov-collector
  namespace: llm-egress
  labels:
    app.kubernetes.io/name: bnkgov-collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: bnkgov-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bnkgov-collector
    spec:
      tolerations:
      - operator: Exists
      containers:
      - name: fluent-bit
        image: cr.fluentbit.io/fluent/fluent-bit:3.0
        volumeMounts:
        - name: config
          mountPath: /fluent-bit/etc/
        - name: varlog
          mountPath: /var/log
        - name: varlibcontainers
          mountPath: /var/lib/containerd
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 192Mi
      volumes:
      - name: config
        configMap:
          name: bnkgov-collector-config
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibcontainers
        hostPath:
          path: /var/lib/containerd
