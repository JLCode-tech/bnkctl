apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: bnk-vertex-demo-gatewayclass
spec:
  controllerName: f5.com/f5-cne-system-f5-cne-controller
  description: F5 BIG-IP Kubernetes Gateway
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mcp-tls
  namespace: default
spec:
  secretName: mcp-tls
  duration: 2160h
  renewBefore: 360h
  commonName: bnk-ingress.bnk-demo.internal
  dnsNames:
  - bnk-ingress.bnk-demo.internal
  issuerRef:
    name: bnk-vertex-demo-ca-cluster-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: gateway.k8s.f5.com/v1alpha1
kind: GatewaySettings
metadata:
  name: gkebnkctl-default
  namespace: default
spec:
  egressConfigs:
  - hardwareAcceleration: none
    name: default-egress
    networkRef:
      name: int-vlan-infra
    sourceNATConfig:
      type: Automap
  ingressConfig:
    defaultListenerNetwork:
      ipamRefs:
      - name: listener-pool
      networkRefs:
      - name: ext-vlan-infra
      sourceNATConfig:
        type: Automap
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: bnk-vertex-demo-gateway
  namespace: default
spec:
  gatewayClassName: bnk-vertex-demo-gatewayclass
  infrastructure:
    parametersRef:
      group: gateway.k8s.f5.com
      kind: GatewaySettings
      name: gkebnkctl-default
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All
      kinds:
      - kind: HTTPRoute
  - name: https
    protocol: HTTPS
    port: 443
    tls:
      certificateRefs:
      - kind: Secret
        group: ""
        name: mcp-tls
        namespace: default
    allowedRoutes:
      namespaces:
        from: All
      kinds:
      - kind: HTTPRoute
  addresses:
  - type: IPAddress
    value: 10.10.1.10
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-default-httproute
  namespace: bnk-demo
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: default
  to:
  - group: ""
    kind: Service
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-tool-route
  namespace: default
spec:
  parentRefs:
  - name: bnk-vertex-demo-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v1/mcp/forecast
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: vertex-finance-mcp
      namespace: bnk-demo
      port: 8080
  - matches:
    - path:
        type: PathPrefix
        value: /.well-known/agent-card.json
    backendRefs:
    - name: vertex-finance-mcp
      namespace: bnk-demo
      port: 8080
