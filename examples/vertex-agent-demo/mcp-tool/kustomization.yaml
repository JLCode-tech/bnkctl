apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bnk-demo

resources:
  - deployment.yaml

configMapGenerator:
  - name: vertex-finance-mcp-script
    files:
      - mcp-server.py

secretGenerator:
  - name: mcp-tokens
    literals:
      - agent-token=demo-agent-token-a7f3c1
      - external-token=demo-external-token-4b9e2d
