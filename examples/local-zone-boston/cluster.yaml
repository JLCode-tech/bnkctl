apiVersion: awsbnkctl/v1
kind: Cluster

metadata:
  name: lz-boston
  region: us-east-1
  labels:
    purpose: bnk-localzone-boston
    environment: edge-lz

pattern: host-device

network:
  vpcCidr: 10.104.0.0/16

  azs:
    - us-east-1a
    - us-east-1b
    - us-east-1-bos-1a

  subnets:
    public:
      - cidr: 10.104.1.0/24
        az: us-east-1a
      - cidr: 10.104.2.0/24
        az: us-east-1b
      - cidr: 10.104.3.0/24
        az: us-east-1-bos-1a

    private:
      - cidr: 10.104.11.0/24
        az: us-east-1a
      - cidr: 10.104.12.0/24
        az: us-east-1b

  dataPath:
    external:
      cidr: 10.104.10.0/24
      az: us-east-1-bos-1a
    internal:
      cidr: 10.104.20.0/24
      az: us-east-1-bos-1a

  natGateways: 1

cluster:
  kubernetesVersion: "1.35"
  nodeGroups:
    - name: lz-workers
      instanceType: m5.2xlarge
      desiredSize: 4
      minSize: 3
      maxSize: 5
      diskSize: 50

bnk:
  farArchive: ../../cne_pull_64.json
  jwt: ../../license.jwt
  bgp: false

forge:
  enabled: true
  projectName: bnk-aws-localzone
  url: http://localhost:8000
  mcpUrl: http://localhost:8081/mcp/
  username: mcp
  password: mcp-svc-local-token-2026-auth
