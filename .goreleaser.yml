# goreleaser config for bnkctl (Unified Multi-Cloud F5 BNK CLI).
# Cross-compile sweep: linux/darwin/windows × amd64/arm64.
version: 2

project_name: bnkctl

before:
  hooks:
    - go mod tidy

builds:
  - id: bnkctl
    main: ./cmd/bnkctl
    binary: bnkctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/JLCode-tech/bnkctl/internal/cli.Version=v{{.Version}}

archives:
  # The name_template here is load-bearing: `pkg/selfupdate/selfupdate.go`
  # matches `<goos>_<goarch>` when `bnkctl self update` runs.
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  header: |
    ## bnkctl {{ .Tag }}

    Unified multi-cloud CLI for deploying, operating, and benchmarking **F5 BIG-IP Next for Kubernetes (BNK)** and **F5 BNK AI Service Plane** across AWS EKS, Azure AKS, and Google Cloud GKE.
  footer: |
    ---
    See [`CHANGELOG.md`](https://github.com/JLCode-tech/bnkctl/blob/main/CHANGELOG.md) for the full per-version change log.

    Verify the downloaded archive against `checksums.txt`:
    ```
    sha256sum -c checksums.txt --ignore-missing
    ```
