# PROVEN LIVE 2026-07-20 on bnk-hostdev — this exact shape reached License
# status Active/eval in ~60s. Without it: "Configs are not allowed since
# license is not activated" and no VLAN programming (contract item 6 in
# reference/TRIAL-NOTES.md).
#
# Rendered by internal/k8s/render.RenderLicenseCR from the JWT file at
