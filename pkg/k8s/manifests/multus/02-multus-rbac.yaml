# AUTHORED, NOT CAPTURED LIVE — reference/install/02-multus-ds.yaml only
# exports the DaemonSet; the ServiceAccount/ClusterRole/ClusterRoleBinding it
# needs were pre-existing on the reference cluster and were not captured.
# This is the standard upstream multus-cni thick-plugin RBAC bundle,
# reconstructed from general knowledge of the k8snetworkplumbingwg/multus-cni
# install manifests — NOT independently verified against the exact
# ghcr.io/k8snetworkplumbingwg/multus-cni:snapshot-thick build this recipe
# pins. If Multus RBAC errors appear in `kubectl logs -n kube-system -l
# app=multus`, diff this against the multus-cni release matching that image.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: multus
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: multus
rules:
  - apiGroups: ["k8s.cni.cncf.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["pods", "pods/status"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  - apiGroups: ["nodes.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: multus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: multus
subjects:
  - kind: ServiceAccount
    name: multus
    namespace: kube-system
