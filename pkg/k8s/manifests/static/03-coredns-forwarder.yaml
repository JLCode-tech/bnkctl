apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-f5
  namespace: kube-system
data:
  Corefile: |
    f5-cne-core.svc.cluster.local:53 {
        errors
        cache 30
        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            endpoint_pod_names
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns-f5
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: coredns-f5
  template:
    metadata:
      labels:
        k8s-app: coredns-f5
    spec:
      serviceAccountName: coredns-f5
      containers:
      - name: coredns
        image: coredns/coredns:1.11.1
        args: ["-conf", "/etc/coredns/Corefile"]
        volumeMounts:
        - name: config-volume
          mountPath: /etc/coredns
          readOnly: true
      volumes:
      - name: config-volume
        configMap:
          name: coredns-f5
          items:
          - key: Corefile
            path: Corefile
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coredns-f5
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: coredns-f5
rules:
- apiGroups: [""]
  resources: ["endpoints", "services", "pods", "namespaces"]
  verbs: ["list", "watch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: coredns-f5
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: coredns-f5
subjects:
- kind: ServiceAccount
  name: coredns-f5
  namespace: kube-system
---
apiVersion: v1
kind: Service
metadata:
  name: coredns-f5
  namespace: kube-system
spec:
  selector:
    k8s-app: coredns-f5
  ports:
  - name: dns
    port: 53
    protocol: UDP
  - name: dns-tcp
    port: 53
    protocol: TCP
