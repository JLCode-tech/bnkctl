---
# Node prep for BNK worker nodes (label role=bnk):
#  - Allocates 2MB HugePages. F5 TMM requires hugepages-2Mi; default 2048 pages = 4GB.
#    Ported from aws-gpu-setup/hugepages-ds.yaml.
#  - Enables proxy ARP on the Amazon VPC CNI pod veths (prefix "eni", plus
#    conf.default so veths created later inherit it). TMM resolves pool-member
#    pod IPs by ARPing on its own pod interface (TMM_CALICO_ROUTER=default
#    assumes a proxy-ARP-answering CNI router, which Calico is and VPC CNI is
#    not); without this the host never answers and every server-side SYN is
#    dropped. Applied on every BNK node because TMM placement is not known here.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hugepages-setup
  namespace: kube-system
  labels:
    app: hugepages-setup
    app.kubernetes.io/managed-by: awsbnkctl
spec:
  selector:
    matchLabels:
      app: hugepages-setup
  template:
    metadata:
      labels:
        app: hugepages-setup
    spec:
      nodeSelector:
        role: bnk
      hostPID: true
      hostNetwork: true
      tolerations:
      - operator: Exists
      restartPolicy: Always
      containers:
      - name: hugepages
        image: alpine:3.20
        securityContext:
          privileged: true
        command:
        - /bin/sh
        - -c
        - |
          set -e
          sysctl -qw net.ipv4.ip_forward=1
          sysctl -qw net.ipv4.conf.default.proxy_arp=1
          sysctl -qw net.netfilter.nf_conntrack_tcp_be_liberal=1 2>/dev/null || true
          for f in /proc/sys/net/ipv4/conf/eni*/proxy_arp; do [ -e "$f" ] && echo 1 > "$f"; done
          echo "[proxy-arp] node=$(hostname) enabled on conf.default and $(ls /proc/sys/net/ipv4/conf/ | grep -c '^eni') existing eni* veths"
          nsenter -t 1 -m -u -i -n -p -- sh -c '
            for dev in ens5 ens6 ens7 ens8; do
              if ip link show "$dev" >/dev/null 2>&1; then
                ip link set "$dev" up 2>/dev/null || true
                ethtool -K "$dev" tso off gso off gro off tx-nocache-copy off 2>/dev/null || true
              fi
            done
            iptables -C FORWARD -m conntrack --ctstate INVALID -j ACCEPT 2>/dev/null || iptables -I FORWARD 1 -m conntrack --ctstate INVALID -j ACCEPT || true
            iptables -t nat -C PREROUTING -s 10.0.10.0/24 -d 172.20.0.0/16 -j KUBE-SERVICES 2>/dev/null || iptables -t nat -I PREROUTING 1 -s 10.0.10.0/24 -d 172.20.0.0/16 -j KUBE-SERVICES || true
            iptables -t nat -C PREROUTING -s 10.0.20.0/24 -d 172.20.0.0/16 -j KUBE-SERVICES 2>/dev/null || iptables -t nat -I PREROUTING 1 -s 10.0.20.0/24 -d 172.20.0.0/16 -j KUBE-SERVICES || true
            iptables -t nat -C POSTROUTING -s 10.0.10.0/24 -d 10.0.0.0/16 -j MASQUERADE 2>/dev/null || iptables -t nat -A POSTROUTING -s 10.0.10.0/24 -d 10.0.0.0/16 -j MASQUERADE || true
            iptables -t nat -C POSTROUTING -s 10.0.20.0/24 -d 10.0.0.0/16 -j MASQUERADE 2>/dev/null || iptables -t nat -A POSTROUTING -s 10.0.20.0/24 -d 10.0.0.0/16 -j MASQUERADE || true
          ' || true
          NEED=2048
          PG=/sys/devices/system/node/node0/hugepages/hugepages-2048kB/nr_hugepages
          CUR=$(cat $PG)
          echo "[hugepages] node=$(hostname) current(2Mi)=$CUR target=$NEED"
          if [ "$CUR" -lt "$NEED" ]; then
            echo $NEED > $PG
            echo "[hugepages] set 2Mi=$(cat $PG)"
            if [ -w /sys/devices/system/node/node0/hugepages/hugepages-1048576kB/nr_hugepages ]; then
              echo 0 > /sys/devices/system/node/node0/hugepages/hugepages-1048576kB/nr_hugepages || true
              echo "[hugepages] zeroed 1Gi pages"
            fi
            nsenter -t 1 -m -u -i -n -p -- systemctl restart kubelet || true
            echo "[hugepages] kubelet restarted to advertise 2Mi capacity"
          fi
          sleep infinity
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
