---
# Node prep for BNK worker nodes (label role=bnk):
#  - Allocates 2MB HugePages. F5 TMM requires hugepages-2Mi; default 2048 pages = 4GB.
#    Ported from aws-gpu-setup/hugepages-ds.yaml.
#  - Enables proxy ARP on the Amazon VPC CNI pod veths (prefix "eni", plus
#    conf.default so veths created later inherit it). TMM resolves pool-member
#    pod IPs by ARPing on its own pod interface (TMM_CALICO_ROUTER=default
#    assumes a proxy-ARP-answering CNI router, which Calico is and VPC CNI is
#    not); without this the host never answers and every server-side SYN is
#    dropped. Applied on every BNK node because TMM placement is not known here.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hugepages-setup
  namespace: kube-system
  labels:
    app: hugepages-setup
    app.kubernetes.io/managed-by: awsbnkctl
spec:
  selector:
    matchLabels:
      app: hugepages-setup
  template:
    metadata:
      labels:
        app: hugepages-setup
    spec:
      nodeSelector:
        role: bnk
      hostPID: true
      hostNetwork: true
      tolerations:
      - operator: Exists
      restartPolicy: Always
      containers:
      - name: hugepages
        image: alpine:3.20
        securityContext:
          privileged: true
        command:
        - /bin/sh
        - -c
        - |
          set -e
          NEED=2048
          PG=/sys/devices/system/node/node0/hugepages/hugepages-2048kB/nr_hugepages
          CUR=$(cat $PG)
          echo "[hugepages] node=$(hostname) current(2Mi)=$CUR target=$NEED"
          if [ "$CUR" -lt "$NEED" ]; then
            echo $NEED > $PG
            echo "[hugepages] set 2Mi=$(cat $PG)"
            if [ -w /sys/devices/system/node/node0/hugepages/hugepages-1048576kB/nr_hugepages ]; then
              echo 0 > /sys/devices/system/node/node0/hugepages/hugepages-1048576kB/nr_hugepages || true
              echo "[hugepages] zeroed 1Gi pages"
            fi
            nsenter -t 1 -m -u -i -n -p -- systemctl restart kubelet || true
            echo "[hugepages] kubelet restarted to advertise 2Mi capacity"
          fi
          while true; do
            sysctl -qw net.ipv4.ip_forward=1 2>/dev/null || true
            sysctl -qw net.ipv4.conf.all.rp_filter=0 2>/dev/null || true
            sysctl -qw net.ipv4.conf.default.proxy_arp=1 2>/dev/null || true
            sysctl -qw net.netfilter.nf_conntrack_tcp_be_liberal=1 2>/dev/null || true
            for f in /proc/sys/net/ipv4/conf/eni*/proxy_arp; do [ -e "$f" ] && echo 1 > "$f" 2>/dev/null || true; done
            nsenter -t 1 -m -u -i -n -p -- sh -c '
              primary_dev=$(ip -4 route show default 2>/dev/null | awk "{for(i=1;i<=NF;i++) if(\$i==\"dev\"){print \$(i+1); exit}}")
              svc_cidr=$(iptables-save -t nat 2>/dev/null | awk "/-j KUBE-SERVICES/ && /-d / {for(i=1;i<=NF;i++) if(\$i==\"-d\"){print \$(i+1); exit}}")
              [ -n "$svc_cidr" ] || svc_cidr="172.20.0.0/16"
              for d in /sys/class/net/*; do
                [ -e "$d/device" ] || continue
                dev=$(basename "$d")
                ip link set "$dev" up 2>/dev/null || true
                ethtool -K "$dev" tso off gso off gro off tx-nocache-copy off 2>/dev/null || true
                if [ -n "$primary_dev" ] && [ "$dev" != "$primary_dev" ]; then
                  for cidr in $(ip -4 route show dev "$dev" proto kernel scope link 2>/dev/null | awk "{print \$1}"); do
                    iptables -t nat -C PREROUTING -s "$cidr" -d "$svc_cidr" -j KUBE-SERVICES 2>/dev/null || iptables -t nat -I PREROUTING 1 -s "$cidr" -d "$svc_cidr" -j KUBE-SERVICES 2>/dev/null || true
                    iptables -t nat -C POSTROUTING -s "$cidr" -j MASQUERADE 2>/dev/null || iptables -t nat -A POSTROUTING -s "$cidr" -j MASQUERADE 2>/dev/null || true
                  done
                fi
              done
              iptables -C FORWARD -m conntrack --ctstate INVALID -j ACCEPT 2>/dev/null || iptables -I FORWARD 1 -m conntrack --ctstate INVALID -j ACCEPT || true
              imds_token=$(curl -sS -m 2 -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 60" 2>/dev/null || true)
              if [ -n "$imds_token" ]; then
                primary_mac=$(cat "/sys/class/net/$primary_dev/address" 2>/dev/null | tr "A-F" "a-f")
                vpc_cidr=$(curl -sS -m 2 -H "X-aws-ec2-metadata-token: $imds_token" "http://169.254.169.254/latest/meta-data/network/interfaces/macs/${primary_mac}/vpc-ipv4-cidr-block" 2>/dev/null || true)
                for mac_dir in $(curl -sS -m 2 -H "X-aws-ec2-metadata-token: $imds_token" "http://169.254.169.254/latest/meta-data/network/interfaces/macs/" 2>/dev/null || true); do
                  mac=$(echo "$mac_dir" | tr -d "/" | tr "A-F" "a-f")
                  [ -n "$mac" ] && [ "$mac" != "$primary_mac" ] || continue
                  sub_cidr=$(curl -sS -m 2 -H "X-aws-ec2-metadata-token: $imds_token" "http://169.254.169.254/latest/meta-data/network/interfaces/macs/${mac}/subnet-ipv4-cidr-block" 2>/dev/null || true)
                  [ -n "$sub_cidr" ] || continue
                  iptables -t nat -C PREROUTING -s "$sub_cidr" -d "$svc_cidr" -j KUBE-SERVICES 2>/dev/null || iptables -t nat -I PREROUTING 1 -s "$sub_cidr" -d "$svc_cidr" -j KUBE-SERVICES || true
                  if [ -n "$vpc_cidr" ]; then
                    iptables -t nat -C POSTROUTING -s "$sub_cidr" -d "$vpc_cidr" -j MASQUERADE 2>/dev/null || iptables -t nat -A POSTROUTING -s "$sub_cidr" -d "$vpc_cidr" -j MASQUERADE || true
                  else
                    iptables -t nat -C POSTROUTING -s "$sub_cidr" -j MASQUERADE 2>/dev/null || iptables -t nat -A POSTROUTING -s "$sub_cidr" -j MASQUERADE || true
                  fi
                done
              fi
            ' || true
            sleep 5
          done
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
