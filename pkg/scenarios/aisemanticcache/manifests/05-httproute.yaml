apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scn-aisemcache-route
  namespace: {{.Namespace}}
  annotations:
    k8s.f5.com/sse-enabled: "true"
spec:
  parentRefs:
  - name: scn-aisemcache-gateway
  hostnames:
  - awsbnkctl-aisemcache.local
  rules:
  - matches:
    - path: {type: PathPrefix, value: /}
    backendRefs:
    - name: nginx
      port: 80
