apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scn-extpool-route
  namespace: {{.Namespace}}
spec:
  parentRefs:
  - name: scn-extpool-gateway
  hostnames:
  - awsbnkctl-extpool.local
  rules:
  - matches:
    - path: {type: PathPrefix, value: /}
    backendRefs:
    - name: ext-backend
      port: 8080
