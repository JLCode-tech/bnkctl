apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: scn-grpc-l4-gateway
  namespace: {{.Namespace}}
spec:
  gatewayClassName: {{.GatewayClassName}}
  infrastructure:
    parametersRef:
      group: gateway.k8s.f5.com
      kind: GatewaySettings
      name: awsbnkctl-grpc
  addresses:
  - type: IPAddress
    value: {{.VIP}}
  listeners:
  - name: tcp-listener
    protocol: TCP
    port: 50052
    allowedRoutes:
      namespaces: {from: Same}
