apiVersion: apps/v1
kind: Deployment
metadata:
  name: udp-echo
  namespace: {{.Namespace}}
  labels: {app: udp-echo}
spec:
  replicas: 2
  selector:
    matchLabels: {app: udp-echo}
  template:
    metadata:
      labels: {app: udp-echo}
    spec:
      containers:
      - name: udp-echo
        image: alpine/socat:1.8.0.0
        args:
        - "-v"
        - "UDP4-LISTEN:5005,fork,reuseaddr"
        - "SYSTEM:echo awsbnkctl-scenario-udp-lb-OK"
        ports: [{containerPort: 5005, protocol: UDP}]
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits:   {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: udp-echo
  namespace: {{.Namespace}}
spec:
  selector: {app: udp-echo}
  ports:
  - {name: udp, port: 5005, targetPort: 5005, protocol: UDP}
