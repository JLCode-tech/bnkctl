apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scn-mv-route-a
  namespace: {{.Namespace}}
spec:
  parentRefs:
  - name: scn-mv-gateway-a
  hostnames:
  - multivip-a.local
  rules:
  - matches:
    - path: {type: PathPrefix, value: /}
    backendRefs:
    - name: mv-a
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scn-mv-route-b
  namespace: {{.Namespace}}
spec:
  parentRefs:
  - name: scn-mv-gateway-b
  hostnames:
  - multivip-b.local
  rules:
  - matches:
    - path: {type: PathPrefix, value: /}
    backendRefs:
    - name: mv-b
      port: 80
