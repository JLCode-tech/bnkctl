apiVersion: v1
kind: ConfigMap
metadata:
  name: tcp-lb-a-index
  namespace: {{.Namespace}}
data:
  index.html: |
    awsbnkctl-scenario-tcp-lb-OK backend=A
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tcp-lb-b-index
  namespace: {{.Namespace}}
data:
  index.html: |
    awsbnkctl-scenario-tcp-lb-OK backend=B
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcp-lb-a
  namespace: {{.Namespace}}
  labels: {app: tcp-lb-a}
spec:
  replicas: 1
  selector:
    matchLabels: {app: tcp-lb-a}
  template:
    metadata:
      labels: {app: tcp-lb-a}
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports: [{containerPort: 80}]
        volumeMounts:
        - {name: html, mountPath: /usr/share/nginx/html}
        readinessProbe:
          tcpSocket: {port: 80}
          initialDelaySeconds: 1
          periodSeconds: 2
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits:   {cpu: 100m, memory: 64Mi}
      volumes:
      - name: html
        configMap: {name: tcp-lb-a-index}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcp-lb-b
  namespace: {{.Namespace}}
  labels: {app: tcp-lb-b}
spec:
  replicas: 1
  selector:
    matchLabels: {app: tcp-lb-b}
  template:
    metadata:
      labels: {app: tcp-lb-b}
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports: [{containerPort: 80}]
        volumeMounts:
        - {name: html, mountPath: /usr/share/nginx/html}
        readinessProbe:
          tcpSocket: {port: 80}
          initialDelaySeconds: 1
          periodSeconds: 2
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits:   {cpu: 100m, memory: 64Mi}
      volumes:
      - name: html
        configMap: {name: tcp-lb-b-index}
---
apiVersion: v1
kind: Service
metadata:
  name: tcp-lb-a
  namespace: {{.Namespace}}
spec:
  selector: {app: tcp-lb-a}
  ports:
  - name: tcp
    port: 80
    targetPort: 80
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: tcp-lb-b
  namespace: {{.Namespace}}
spec:
  selector: {app: tcp-lb-b}
  ports:
  - name: tcp
    port: 80
    targetPort: 80
    protocol: TCP
