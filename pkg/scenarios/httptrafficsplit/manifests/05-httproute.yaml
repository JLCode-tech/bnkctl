apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scn-split-route
  namespace: {{.Namespace}}
spec:
  parentRefs:
  - name: scn-split-gateway
  hostnames:
  - awsbnkctl-split.local
  rules:
  - matches:
    - path: {type: PathPrefix, value: /}
    backendRefs:
    - name: backend-a
      port: 80
      weight: 70
    - name: backend-b
      port: 80
      weight: 30
