apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scn-aitokens-route
  namespace: {{.Namespace}}
spec:
  parentRefs:
  - name: scn-aitokens-gateway
  hostnames:
  - awsbnkctl-aitokens.local
  rules:
  - matches:
    - path: {type: PathPrefix, value: /}
    backendRefs:
    - name: nginx
      port: 80
